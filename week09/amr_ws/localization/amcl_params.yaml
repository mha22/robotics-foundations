amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: "/scan"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    min_particles: 500
    max_particles: 2000
    max_beams: 60

    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    transform_tolerance: 1.0
    tf_broadcast: true
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "map"
